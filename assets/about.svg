<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" role="img" aria-label="Section 00 / About">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
      .h     { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 0.28em; }
      .body  { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
      .meta  { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 400; letter-spacing: 0.06em; }
      .big   { font-family: 'Helvetica Neue', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: -0.04em; }
    </style>
  </defs>

  <rect width="1280" height="280" fill="#0d1117"/>

  <line x1="80" y1="30" x2="1200" y2="30" stroke="#30363d" stroke-width="0.6"/>
  <text x="80" y="22" class="meta" font-size="10" fill="#7d8590">SECTION 00 / ABOUT</text>
  <text x="1200" y="22" text-anchor="end" class="meta" font-size="10" fill="#7d8590">PROFILE / READ ME FIRST</text>

  <!-- left column: text bio -->
  <g transform="translate(80,80)">
    <text class="title" font-size="36" fill="#f0f6fc">
      个人开发者<tspan fill="#7d8590" font-weight="400">  /  学习者</tspan>
    </text>
    <text class="body" font-size="14" fill="#c9d1d9" y="40">AI 黑客松 / 班级管理</text>
    <text class="body" font-size="14" fill="#c9d1d9" y="62">长江大学 yangtze university &#183; 火烧眉毛效率爆表 &#183; 中文沟通</text>
    <text class="body" font-size="14" fill="#c9d1d9" y="84">产品经理 / 小说爱好者 / AI 创作</text>

    <g transform="translate(0,114)">
      <rect width="60" height="1" fill="#ff7b72"/>
      <text x="0" y="22" class="meta" font-size="10" fill="#7d8590">学 习 强 化 中  /  协 作 欢 迎  /  邮 件 见 文 末</text>
    </g>
  </g>

  <!-- right column: 4 big metrics -->
  <g transform="translate(720,80)">
    <g>
      <text class="meta" font-size="9" fill="#7d8590" y="0">PUBLIC REPOS</text>
      <text class="big"  font-size="48" fill="#f0f6fc" y="40">2</text>
      <line x1="0" y1="48" x2="100" y2="48" stroke="#ff7b72" stroke-width="1"/>
    </g>
    <g transform="translate(120,0)">
      <text class="meta" font-size="9" fill="#7d8590" y="0">PRIMARY LANG</text>
      <text class="big"  font-size="48" fill="#f0f6fc" y="40">HTML</text>
      <line x1="0" y1="48" x2="100" y2="48" stroke="#58a6ff" stroke-width="1"/>
    </g>
    <g transform="translate(280,0)">
      <text class="meta" font-size="9" fill="#7d8590" y="0">FOLLOWERS</text>
      <text class="big"  font-size="48" fill="#f0f6fc" y="40">1</text>
      <line x1="0" y1="48" x2="100" y2="48" stroke="#7ee787" stroke-width="1"/>
    </g>
    <g transform="translate(400,0)">
      <text class="meta" font-size="9" fill="#7d8590" y="0">SINCE</text>
      <text class="big"  font-size="48" fill="#f0f6fc" y="40">26&#39;</text>
      <line x1="0" y1="48" x2="100" y2="48" stroke="#ffd33d" stroke-width="1"/>
    </g>

    <g transform="translate(0,90)">
      <text class="meta" font-size="9" fill="#7d8590" y="0">ALSO DOING</text>
      <text class="body" font-size="13" fill="#c9d1d9" y="22">Edge Intelligence 边缘智能</text>
      <text class="body" font-size="13" fill="#c9d1d9" y="42">claude code / codex</text>
      <text class="body" font-size="13" fill="#c9d1d9" y="62">单片机学习，打基础，做科研前置准备</text>
    </g>
  </g>

  <!-- bottom border with moving dot -->
  <g transform="translate(80,258)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#30363d" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#7ee787">
      <animateMotion dur="5s" repeatCount="indefinite" path="M0,0 L1120,0 L1120,0 L0,0"/>
    </circle>
  </g>
</svg>
